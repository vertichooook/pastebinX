name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: docker build -t private-paste:verify .
      - name: Verify Compose startup and automatic bootstrap
        run: |
          bash scripts/configure-env.sh https://test.example.com > /dev/null
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = '404' ]; then
              break
            fi
            sleep 2
          done
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" != '404' ]; then
            docker compose logs --tail=80 app
            exit 1
          fi
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/'+process.env.ADMIN_PATH).then(async r=>{if(r.status!==200 || !(await r.text()).includes('Sign In')) process.exit(1)}).catch(()=>process.exit(1))"
      - name: Stop containers
        if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi
